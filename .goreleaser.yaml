# goreleaser config for tadu. Produces static, single-file binaries for
# linux/darwin on amd64/arm64 and packages them as tar.gz assets matching the
# names the install script expects (tadu_<os>_<arch>.tar.gz).
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tadu
    main: .
    binary: tadu
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/tvdavies/tadu/internal/cli.Version={{.Version}}

archives:
  - id: tadu
    formats: [tar.gz]
    name_template: "tadu_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  prerelease: auto

changelog:
  use: github
  sort: asc
