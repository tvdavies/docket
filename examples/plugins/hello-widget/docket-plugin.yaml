name: hello-widget
version: 0.1.0
description: Minimal sandboxed plugin UI — a task widget, a task panel and a workspace page, no service.
requires:
  docket: ">=0.6.0"

cli:
  run: bin/hello-widget

ui:
  dir: ui
  capabilities: [task.read, task.comment]
  widgets:
    - type: hello-widget/greeting
      title: Greeting
      entry: widget.html
      slots: [board, activity]
  panels:
    - id: notes
      title: Hello
      entry: panel.html
  pages:
    - id: overview
      title: Hello
      entry: page.html
