<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<h3 id="title">Task</h3>
<pre id="task" class="muted">Loading…</pre>
<script type="module">
  import { connect } from "/plugin-sdk/v1/client.js";
  const docket = await connect();
  const show = async () => {
    const task = await docket.readTask();
    document.getElementById("title").textContent = `${task.id} · ${task.title}`;
    document.getElementById("task").textContent = JSON.stringify({ status: task.status, labels: task.labels, references: task.references.length }, null, 2);
  };
  docket.onUpdate(() => void show());
  await show();
</script>
