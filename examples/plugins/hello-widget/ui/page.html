<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<h2>Hello from a plugin page</h2>
<p class="muted">This page runs in a sandboxed iframe with an opaque origin. It cannot call Docket's API directly:</p>
<pre id="probe">Probing…</pre>
<script type="module">
  import { connect } from "/plugin-sdk/v1/client.js";
  const docket = await connect();
  const probe = document.getElementById("probe");
  try {
    await fetch("/api/workspaces");
    probe.textContent = "Unexpected: direct fetch succeeded";
  } catch (error) {
    probe.textContent = `Direct fetch blocked as expected (${error.name}).\nWorkspace: ${docket.context.workspace}\nCapabilities: ${docket.context.capabilities.join(", ")}`;
  }
</script>
