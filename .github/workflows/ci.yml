name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Verify committed web build and bundle budget
        run: make web-check
      - name: Verify public widget contract and fixture bundle
        run: cd web && bun run check:contracts && WIDGET_EVIDENCE_DIR=/tmp/docket-widget-evidence bun run check:widget-bundle
      - name: Widget browser conformance (isolated fixture APIs)
        run: |
          cd web
          bunx playwright install --with-deps chromium
          WIDGET_EVIDENCE_DIR=/tmp/docket-widget-evidence bun run check:widgets
      - name: Test
        run: make test
      - name: Vet
        run: make vet
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
